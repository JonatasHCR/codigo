services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: America/Sao_Paulo
    ports:
      - "3307:3306"
    volumes:
      - dados-mysql:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    build: .
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      TZ: America/Sao_Paulo
    ports:
      - "3000:80"
    volumes:
      - fotos-produtos:/var/www/html/public/uploads   # fotos enviadas não somem ao recriar o container
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  dados-mysql:
  fotos-produtos:
