<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fornecedores | Loja Modelo</title>
  <link rel="icon" href="favicon.svg">
  <link rel="stylesheet" href="css/base.css">
  <script type="module" src="js/fornecedores.js"></script>
</head>
<body>
  <main>
    <section class="cartao">
      <div class="cabecalho-secao">
        <h2 id="tituloForm">Novo fornecedor</h2>
        <button type="button" id="cancelarEdicao" class="secundario pequeno" hidden>Cancelar edição</button>
      </div>
      <form id="formCadastro" class="grade-form">
        <label>Razão social <input name="razaoSocial" required maxlength="120"></label>
        <label>Nome fantasia <input name="nomeFantasia" maxlength="100"></label>
        <label>CNPJ <input name="cnpjFornecedor" required inputmode="numeric" maxlength="18" placeholder="00.000.000/0000-00"></label>
        <label>Inscrição estadual <input name="inscricaoEstadual" maxlength="20"></label>
        <label>Telefone <input name="telefoneFornecedor" type="tel"></label>
        <label>E-mail <input name="emailFornecedor" type="email"></label>
        <label>Contato <input name="nomeContato" maxlength="80"></label>
        <label class="largo">Endereço <input name="enderecoFornecedor" maxlength="150"></label>
        <label>Cidade <input name="cidadeFornecedor" maxlength="60"></label>
        <label>UF <input name="ufFornecedor" maxlength="2"></label>
        <button type="submit">Salvar</button>
      </form>
      <p id="mensagem" class="mensagem" role="status"></p>
    </section>

    <section class="cartao">
      <div class="cabecalho-secao">
        <h2>Fornecedores</h2>
        <input type="search" id="busca" placeholder="Buscar..." aria-label="Buscar fornecedor">
      </div>
      <div class="tabela-rolagem">
        <table>
          <thead><tr><th>Razão social</th><th>CNPJ</th><th>Contato</th><th>Telefone</th><th>Cidade</th><th>Ações</th></tr></thead>
          <tbody id="lista"></tbody>
        </table>
      </div>
    </section>
  </main>
</body>
</html>
