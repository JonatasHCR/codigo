<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clientes | Loja Modelo</title>
  <link rel="icon" href="favicon.svg">
  <link rel="stylesheet" href="css/base.css">
  <script type="module" src="js/clientes.js"></script>
</head>
<body>
  <main>
    <section class="cartao">
      <div class="cabecalho-secao">
        <h2 id="tituloForm">Novo cliente</h2>
        <button type="button" id="cancelarEdicao" class="secundario pequeno" hidden>Cancelar edição</button>
      </div>
      <form id="formCliente" class="grade-form">
        <label>Nome
          <input name="nomeCliente" required maxlength="100">
        </label>
        <label>CPF
          <input name="cpfCliente" required inputmode="numeric" maxlength="14" placeholder="000.000.000-00">
        </label>
        <label>Telefone (WhatsApp)
          <input name="telefoneCliente" type="tel" required placeholder="(71) 99999-0000">
        </label>
        <label>E-mail
          <input name="emailCliente" type="email">
        </label>
        <label>Data de nascimento
          <input name="dataNascimento" type="date">
        </label>
        <label>CEP
          <input name="cepCliente" inputmode="numeric" maxlength="9" placeholder="Preenche o endereço">
        </label>
        <label class="largo">Endereço
          <input name="enderecoCliente" maxlength="150">
        </label>
        <label>Número
          <input name="numeroEndereco" maxlength="10">
        </label>
        <label>Bairro
          <input name="bairroCliente" maxlength="60">
        </label>
        <label>Cidade
          <input name="cidadeCliente" maxlength="60">
        </label>
        <label>UF
          <input name="ufCliente" maxlength="2">
        </label>
        <label class="inline largo">
          <input type="checkbox" name="consentimentoLgpd">
          O cliente autoriza o uso dos dados para cadastro e programa de fidelidade (LGPD)
        </label>
        <button type="submit">Salvar</button>
      </form>
      <p id="mensagem" class="mensagem" role="status"></p>
    </section>

    <section class="cartao">
      <div class="cabecalho-secao">
        <h2>Clientes</h2>
        <input type="search" id="busca" placeholder="Buscar por nome ou CPF..." aria-label="Buscar cliente">
      </div>
      <div class="tabela-rolagem">
        <table>
          <thead>
            <tr><th>Nome</th><th>CPF</th><th>Telefone</th><th class="numero">Pontos</th><th>Ações</th></tr>
          </thead>
          <tbody id="listaClientes"></tbody>
        </table>
      </div>
    </section>
  </main>
</body>
</html>
