<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Promoções | Loja Modelo</title>
  <link rel="icon" href="favicon.svg">
  <link rel="stylesheet" href="css/base.css">
  <script type="module" src="js/promocoes.js"></script>
</head>
<body>
  <main>
    <section class="cartao">
      <div class="cabecalho-secao">
        <h2 id="tituloForm">Nova promoção</h2>
        <button type="button" id="cancelarEdicao" class="secundario pequeno" hidden>Cancelar edição</button>
      </div>
      <p class="suave">A promoção ativa é aplicada <b>automaticamente</b> no PDV aos produtos escolhidos (RF11).</p>
      <form id="formCadastro" class="grade-form">
        <label>Nome <input name="nomePromocao" required maxlength="80" placeholder="Ex.: 20% em sandálias"></label>
        <label>Tipo de desconto
          <select name="tipoDesconto" required>
            <option value="PERCENTUAL">Percentual (%)</option>
            <option value="VALOR_FIXO">Valor fixo (R$ por unidade)</option>
          </select>
        </label>
        <label>Desconto <input name="valorDesconto" type="number" min="0.01" step="0.01" required></label>
        <label>Início <input name="dataInicio" type="date" required></label>
        <label>Fim <input name="dataFim" type="date" required></label>
        <label>Categoria <select name="idCategoria" id="selCategoria"></select></label>
        <label>…ou produto <select name="idProduto" id="selProduto"></select></label>
        <button type="submit">Salvar</button>
      </form>
      <p id="mensagem" class="mensagem" role="status"></p>
    </section>

    <section class="cartao">
      <h2>Promoções</h2>
      <div class="tabela-rolagem">
        <table>
          <thead><tr><th>Nome</th><th>Desconto</th><th>Aplica em</th><th>Período</th><th>Situação</th><th>Ações</th></tr></thead>
          <tbody id="lista"></tbody>
        </table>
      </div>
    </section>
  </main>
</body>
</html>
