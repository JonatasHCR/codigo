<VirtualHost *:80>
    # Só a pasta public fica acessível pelo navegador; src/, vendor/ e scripts/ ficam protegidos
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
    </Directory>

    # Fotos enviadas pelos usuários: nunca executar código nessa pasta
    <Directory /var/www/html/public/uploads>
        php_admin_flag engine off
        Options -Indexes
    </Directory>

    # Repassa as variáveis do .env (definidas pelo Docker) para o PHP
    PassEnv DB_HOST DB_PORT DB_USER DB_PASSWORD DB_NAME APP_ENV

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
